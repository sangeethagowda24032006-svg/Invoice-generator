<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Invoice Generator</h1>
        <p>Create and manage your invoices easily</p>
    </header>
    <main>
        <section>
            <h2>Customer Details</h2>
            <form id="invoiceForm">
                <div>
                    <label for="customerName">Customer Name</label>
                    <input type="text" id="customerName" name="customerName"  placeholder="Enter customer name">
                </div>
                <div>
                    <label for="customerEmail">Email</label>
                    <input type="email" id="customerEmail" name="customerEmail" placeholder="Enter customer email">
                </div>
                <div>
                    <label for="customerPhone">Phone Number</label>
                    <input type="tel" id="customerPhone" name="customerPhone" placeholder="Enter phone number">
                </div>
                <div>
                    <label for="invoiceDate">Invoice Date</label>
                    <input type="date" id="invoiceDate" name="invoiceDate">
                </div>
            </form>
        </section>
        <section>
            <h2>Invoice Items</h2>
            <button type="button" id="addItemBtn">+ Add Item</button>
            <div id="itemsContainer">
                <article class="invoice-item">
                    <div>
                        <label>Item Name</label>
                        <input type="text" class="itemName" placeholder="Enter item name">
                    </div>
                    <div>
                        <label>Quantity</label>
                        <input type="number" class="quantity" min="1" placeholder="0">
                    </div>
                    <div>
                        <label>Unit Price</label>
                        <input type="number" class="unitPrice" min="0" step="0.01" placeholder="0.00">
                    </div>
                    <div>
                        <label>Line Total</label>
                        <input type="text" class="lineTotal" value="₹0.00" readonly>
                    </div>
                    <div>
                        <button type="button" class="editBtn">Edit</button>
                        <button type="button" class="deleteBtn">Delete</button>
                    </div>
                </article>
            </div>
        </section>
        <section>
            <h2>Tax</h2>
            <div>
                <label for="taxRate">Tax Rate (%)</label>
                <input type="number" id="taxRate" min="0" max="100" step="0.01" value="0" placeholder="Enter tax percentage">
            </div>
        </section>
        <section>
            <h2>Invoice Summary</h2>
            <div>
                <p> Subtotal: <span id="subtotal">₹0.00</span></p> 
                <p> Tax:<span id="taxAmount">₹0.00</span></p>
                <p> <strong>Grand Total: <span id="grandTotal">₹0.00</span></strong></p>
            </div>
        </section>
        <section>
            <h2>Actions</h2>
            <button type="button" id="previewBtn">Preview Invoice</button>
            <button type="button" id="resetBtn"> Reset</button>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
